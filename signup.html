<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up · PainSignal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { -webkit-font-smoothing: antialiased; }
  html, body {
    background: #0a0a0f;
    color: #f4f4f5;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(167,139,250,0.2), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(56,189,248,0.15), transparent 50%);
    z-index: 0;
  }
  .glass {
    background: rgba(255,255,255,0.025);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
  }
  .grad-text {
    background: linear-gradient(135deg, #a78bfa, #38bdf8, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .btn-primary {
    background: linear-gradient(135deg, #a78bfa, #8b5cf6);
    transition: all 0.3s;
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(167,139,250,0.4); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  input:focus { outline: none; border-color: rgba(167,139,250,0.5); }
</style>
</head>
<body class="flex items-center justify-center p-6 relative">

  <a href="/index.html" class="absolute top-6 left-6 flex items-center gap-2 z-20">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-cyan-400 flex items-center justify-center font-black text-black text-sm">P</div>
    <span class="font-bold">PainSignal</span>
  </a>

  <div class="glass max-w-md w-full p-10 relative z-10">
    <h1 class="text-3xl font-black mb-2">Create your <span class="grad-text">account</span></h1>
    <p class="text-zinc-400 text-sm mb-8">Start with the free tier — see top 3 pain points instantly.</p>

    <form id="signup-form" class="space-y-4">
      <div>
        <label class="text-xs mono text-zinc-500 mb-2 block">EMAIL</label>
        <input type="email" id="email" required
               class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-zinc-600"
               placeholder="founder@yourcompany.com" />
      </div>
      <div>
        <label class="text-xs mono text-zinc-500 mb-2 block">PASSWORD <span class="text-zinc-700">(min 8 chars)</span></label>
        <input type="password" id="password" required minlength="8"
               class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-zinc-600"
               placeholder="••••••••" />
      </div>

      <div id="error" class="hidden text-sm text-red-400 mono"></div>

      <button type="submit" id="submit-btn"
              class="btn-primary w-full py-3 rounded-xl font-semibold text-white">
        Create account
      </button>
    </form>

    <p class="text-center text-sm text-zinc-500 mt-6">
      Already have an account? <a href="/login.html" class="text-violet-300 hover:text-violet-200">Log in</a>
    </p>
  </div>

<script>
const API = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
  ? "http://localhost:8000"
  : "https://painsignal-api.onrender.com";  // <-- UPDATE THIS after deploying to Render

document.getElementById("signup-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("submit-btn");
  const errBox = document.getElementById("error");

  errBox.classList.add("hidden");
  btn.textContent = "Creating account...";
  btn.disabled = true;

  try {
    const res = await fetch(API + "/api/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.detail || "Signup failed");

    localStorage.setItem("token", data.access_token);
    window.location.href = "/dashboard.html";
  } catch (err) {
    errBox.textContent = "✗ " + err.message;
    errBox.classList.remove("hidden");
    btn.textContent = "Create account";
    btn.disabled = false;
  }
});
</script>

</body>
</html>
